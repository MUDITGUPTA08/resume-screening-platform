<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture diagram: Candidate Portal and Hiring Dashboard both send requests to the Server. The admin request passes through a passcode check first. The server calls the Groq LLM to screen resumes and reads and writes the Database, which has a jobs table linked one-to-many to an applications table.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Candidate Portal -->
  <rect x="40" y="30" width="230" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">Candidate Portal</text>
  <text x="155" y="82" font-family="Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle">public, no login</text>

  <!-- Hiring Dashboard -->
  <rect x="630" y="30" width="230" height="70" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="745" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">Hiring Dashboard</text>
  <text x="745" y="82" font-family="Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle">passcode protected</text>

  <!-- arrows down to server -->
  <line x1="155" y1="100" x2="155" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="170" y="145" font-family="Arial, sans-serif" font-size="13" fill="#2563eb">submit application</text>

  <line x1="745" y1="100" x2="745" y2="180" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="600" y="145" font-family="Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="end">passcode check</text>

  <!-- Server -->
  <rect x="240" y="190" width="420" height="110" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/>
  <text x="450" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">Server</text>
  <text x="450" y="246" font-family="Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle">validates request, screens resume,</text>
  <text x="450" y="266" font-family="Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle">only place scores are ever read</text>
  <text x="450" y="288" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">candidate response: confirmation message only</text>

  <!-- Server to LLM -->
  <line x1="660" y1="245" x2="770" y2="245" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="775" y="205" width="105" height="80" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="827" y="238" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Groq</text>
  <text x="827" y="256" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">LLM</text>
  <text x="827" y="275" font-family="Arial, sans-serif" font-size="10.5" fill="#666666" text-anchor="middle">scores resume</text>

  <!-- Server to DB -->
  <line x1="450" y1="300" x2="450" y2="370" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="465" y="340" font-family="Arial, sans-serif" font-size="13" fill="#444444">reads / writes</text>

  <!-- Database -->
  <rect x="180" y="380" width="540" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="412" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">Database</text>

  <!-- jobs table -->
  <rect x="220" y="430" width="200" height="80" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="455" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">jobs</text>
  <text x="320" y="475" font-family="Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">one row per job</text>
  <text x="320" y="492" font-family="Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">posting</text>

  <!-- 1:N arrow -->
  <line x1="420" y1="470" x2="470" y2="470" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="460" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">1 : N</text>

  <!-- applications table -->
  <rect x="475" y="430" width="220" height="80" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="585" y="455" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">applications</text>
  <text x="585" y="475" font-family="Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">many rows per job,</text>
  <text x="585" y="492" font-family="Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">one per candidate</text>
</svg>
